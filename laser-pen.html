<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Reader Pro & Laser Tool</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        /* Pen Pointer Cursor */
        .pen-cursor {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23f43f5e' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z'></path></svg>") 0 24, crosshair !important;
        }

        /* Hand / Grab Cursors */
        .grab-cursor {
            cursor: grab !important;
        }
        .grabbing-cursor {
            cursor: grabbing !important;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col font-sans overflow-hidden select-none">

    <!-- Top Toolbar Header -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 shadow-xl z-30 shrink-0">
        
        <!-- Left Section: Logo, Sidebar Toggle & File Opener -->
        <div class="flex items-center space-x-3">
            <button id="sidebar-toggle-btn" title="Toggle Sidebar (S)" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl transition border border-slate-700/60 active:scale-95 flex items-center justify-center">
                <i data-lucide="panel-left-toggle" class="w-4 h-4"></i>
            </button>

            <div class="flex items-center space-x-2.5">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2 rounded-xl text-white shadow-md shadow-indigo-500/20">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-base tracking-wide bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent hidden sm:inline">PDF Pro</span>
            </div>
            
            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition shadow-lg shadow-indigo-600/20 flex items-center space-x-2 active:scale-95">
                <i data-lucide="folder-open" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Open PDF</span>
                <input type="file" id="file-input" accept="application/pdf" class="hidden">
            </label>
        </div>

        <!-- Middle Section: Pagination Controls -->
        <div class="flex items-center space-x-1.5 bg-slate-950/80 px-3 py-1 rounded-xl border border-slate-800">
            <button id="prev-page-btn" title="Previous Page (Left Arrow)" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white transition disabled:opacity-30 disabled:hover:bg-transparent">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <div class="text-xs sm:text-sm font-medium flex items-center space-x-1.5 text-slate-300">
                <span>Page</span>
                <input type="number" id="page-num-input" value="1" min="1" class="w-11 bg-slate-900 text-center border border-slate-700 rounded-lg py-0.5 text-slate-100 focus:outline-none focus:border-indigo-500 text-xs sm:text-sm">
                <span>of <span id="page-count-display" class="text-slate-400">0</span></span>
            </div>
            <button id="next-page-btn" title="Next Page (Right Arrow)" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white transition disabled:opacity-30 disabled:hover:bg-transparent">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Right Section: Tools (Laser, Hand, Colors, Zoom, Fit) -->
        <div class="flex items-center space-x-2">
            
            <!-- Tool Modes (Laser Pencil & Hand Pan Tool) -->
            <div class="flex items-center space-x-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
                <button id="laser-tool-btn" title="Laser Pencil Tool (L) - Left Click to Draw" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 bg-indigo-600/30 text-indigo-300 border border-indigo-500/50 shadow-xs">
                    <i data-lucide="highlighter" class="w-3.5 h-3.5 text-rose-400"></i>
                    <span class="hidden md:inline">Laser</span>
                </button>
                <button id="hand-tool-btn" title="Hand Tool (H) - Pan in 4 directions" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800">
                    <i data-lucide="hand" class="w-3.5 h-3.5"></i>
                    <span class="hidden md:inline">Hand</span>
                </button>
            </div>

            <!-- Color Palette for Laser Pencil -->
            <div id="color-palette" class="flex items-center space-x-1.5 bg-slate-950/80 px-2 py-1.5 rounded-xl border border-slate-800">
                <button class="w-4 h-4 rounded-full bg-rose-500 ring-2 ring-white transition transform hover:scale-125 color-option" data-color="rgba(244, 63, 94, 0.95)" title="Neon Red"></button>
                <button class="w-4 h-4 rounded-full bg-cyan-400 transition transform hover:scale-125 color-option" data-color="rgba(34, 211, 238, 0.95)" title="Neon Blue"></button>
                <button class="w-4 h-4 rounded-full bg-emerald-400 transition transform hover:scale-125 color-option" data-color="rgba(52, 211, 153, 0.95)" title="Neon Green"></button>
                <button class="w-4 h-4 rounded-full bg-amber-400 transition transform hover:scale-125 color-option" data-color="rgba(251, 191, 36, 0.95)" title="Bright Yellow"></button>
                <button class="w-4 h-4 rounded-full bg-fuchsia-500 transition transform hover:scale-125 color-option" data-color="rgba(217, 70, 239, 0.95)" title="Neon Pink"></button>
                <button class="w-4 h-4 rounded-full bg-orange-500 transition transform hover:scale-125 color-option" data-color="rgba(249, 115, 22, 0.95)" title="Vibrant Orange"></button>
            </div>

            <!-- Zoom Options -->
            <div class="flex items-center space-x-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
                <button id="zoom-out-btn" title="Zoom Out (-)" class="p-1 hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white transition">
                    <i data-lucide="zoom-out" class="w-4 h-4"></i>
                </button>
                <span id="zoom-display" class="text-xs font-semibold w-12 text-center text-slate-300">100%</span>
                <button id="zoom-in-btn" title="Zoom In (+)" class="p-1 hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white transition">
                    <i data-lucide="zoom-in" class="w-4 h-4"></i>
                </button>
                <button id="zoom-reset-btn" title="Reset Zoom" class="p-1 hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white transition">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <!-- Page Fit Options -->
            <div class="hidden lg:flex items-center space-x-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
                <button id="fit-width-btn" title="Fit to Container Width" class="px-2.5 py-1 text-xs font-medium hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white transition">
                    Fit Width
                </button>
                <button id="fit-screen-btn" title="Fit Entire Page to Screen" class="px-2.5 py-1 text-xs font-medium hover:bg-slate-800 rounded-lg text-slate-300 hover:text-white transition">
                    Fit Screen
                </button>
            </div>

        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Collapsible Sidebar for Page Thumbnails -->
        <aside id="thumbnail-sidebar" class="w-64 bg-slate-900/95 border-r border-slate-800/80 flex flex-col transition-all duration-300 ease-in-out z-20 shrink-0">
            <div class="p-3 border-b border-slate-800/80 font-semibold text-xs text-slate-400 flex items-center justify-between uppercase tracking-wider">
                <span>Page Thumbnails</span>
                <span id="thumb-count-tag" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded-full text-slate-300">0 pages</span>
            </div>
            <div id="thumbnails-wrapper" class="flex-1 overflow-y-auto p-3 space-y-3">
                <!-- Dynamic Thumbnail Canvases Rendered Here -->
            </div>
        </aside>

        <!-- Viewer Scrollable Area for PDF Display & Annotation -->
        <main id="viewer-container" class="flex-1 bg-slate-950 overflow-auto relative flex flex-col items-center justify-start p-6 md:p-8 pen-cursor">
            
            <!-- Empty State / Drag and Drop Prompt -->
            <div id="welcome-drop-zone" class="my-auto max-w-md w-full border-2 border-dashed border-slate-800/80 rounded-3xl flex flex-col items-center justify-center text-center p-8 bg-slate-900/40 backdrop-blur-md transition hover:border-indigo-500/60 cursor-pointer shadow-2xl">
                <div class="w-16 h-16 bg-indigo-600/10 text-indigo-400 rounded-2xl flex items-center justify-center mb-4 text-2xl border border-indigo-500/20">
                    <i data-lucide="upload-cloud" class="w-8 h-8"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-100 mb-1">Open PDF Document</h2>
                <p class="text-xs text-slate-400 mb-6 leading-relaxed">Drag & drop your PDF file here, or click below to explore with multi-color fading laser annotations and pan features.</p>
                <div class="flex flex-wrap items-center justify-center gap-3">
                    <label class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl text-xs shadow-lg shadow-indigo-600/20 transition cursor-pointer">
                        Browse File
                        <input type="file" id="dropzone-file-input" accept="application/pdf" class="hidden">
                    </label>
                    <button id="load-sample-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-4 py-2 rounded-xl text-xs border border-slate-700/80 transition">
                        Load Sample PDF
                    </button>
                </div>
            </div>

            <!-- PDF Page Wrapper with Overlay Canvas -->
            <div id="pdf-wrapper" class="relative shadow-2xl rounded-lg bg-white hidden my-auto mx-auto shrink-0 border border-slate-800">
                <!-- PDF Render Canvas -->
                <canvas id="pdf-render-canvas" class="block rounded"></canvas>
                <!-- Laser Drawing Canvas Layer -->
                <canvas id="laser-draw-canvas" class="absolute inset-0 rounded"></canvas>
            </div>

        </main>
    </div>

    <!-- Toast / Dialog Message Modal -->
    <div id="dialog-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center hidden backdrop-blur-xs">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl text-center">
            <div id="modal-icon-wrap" class="w-12 h-12 rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center mx-auto mb-4">
                <i data-lucide="alert-circle" class="w-6 h-6"></i>
            </div>
            <h3 id="modal-title-text" class="text-base font-bold text-slate-100 mb-1">Notice</h3>
            <p id="modal-body-text" class="text-xs text-slate-400 mb-5 leading-relaxed">System message content.</p>
            <button id="modal-close-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-xs font-semibold transition shadow-md">
                Acknowledge
            </button>
        </div>
    </div>

    <!-- Application Controller Logic -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // PDF.js Core Variables
        let pdfDoc = null;
        let currentPageNum = 1;
        let isRenderingPage = false;
        let pendingPageNum = null;
        let currentScale = 1.25;

        // Tool Modes: 'laser' or 'hand'
        let activeTool = 'laser'; 
        let laserPenColor = 'rgba(244, 63, 94, 0.95)';

        // Laser Strokes state for fading animation
        let strokePoints = [];
        let isDrawingLaser = false;

        // Hand / Pan Navigation state
        let isPanning = false;
        let panStartX = 0;
        let panStartY = 0;
        let scrollStartX = 0;
        let scrollStartY = 0;

        // DOM Element Cache
        const viewerContainer = document.getElementById('viewer-container');
        const pdfWrapper = document.getElementById('pdf-wrapper');
        const pdfCanvas = document.getElementById('pdf-render-canvas');
        const pdfCtx = pdfCanvas.getContext('2d');
        const laserCanvas = document.getElementById('laser-draw-canvas');
        const laserCtx = laserCanvas.getContext('2d');

        const thumbnailSidebar = document.getElementById('thumbnail-sidebar');
        const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
        const thumbnailsWrapper = document.getElementById('thumbnails-wrapper');
        const thumbCountTag = document.getElementById('thumb-count-tag');

        const welcomeDropZone = document.getElementById('welcome-drop-zone');
        const fileInput = document.getElementById('file-input');
        const dropzoneFileInput = document.getElementById('dropzone-file-input');
        const loadSampleBtn = document.getElementById('load-sample-btn');

        const pageNumInput = document.getElementById('page-num-input');
        const pageCountDisplay = document.getElementById('page-count-display');
        const prevPageBtn = document.getElementById('prev-page-btn');
        const nextPageBtn = document.getElementById('next-page-btn');

        const zoomInBtn = document.getElementById('zoom-in-btn');
        const zoomOutBtn = document.getElementById('zoom-out-btn');
        const zoomResetBtn = document.getElementById('zoom-reset-btn');
        const zoomDisplay = document.getElementById('zoom-display');
        const fitWidthBtn = document.getElementById('fit-width-btn');
        const fitScreenBtn = document.getElementById('fit-screen-btn');

        const laserToolBtn = document.getElementById('laser-tool-btn');
        const handToolBtn = document.getElementById('hand-tool-btn');
        const colorPalette = document.getElementById('color-palette');

        // Modal Handler
        function displayModal(title, message, isError = true) {
            document.getElementById('modal-title-text').textContent = title;
            document.getElementById('modal-body-text').textContent = message;
            const iconWrap = document.getElementById('modal-icon-wrap');
            if (isError) {
                iconWrap.className = "w-12 h-12 rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center mx-auto mb-4";
                iconWrap.innerHTML = '<i data-lucide="alert-circle" class="w-6 h-6"></i>';
            } else {
                iconWrap.className = "w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center mx-auto mb-4";
                iconWrap.innerHTML = '<i data-lucide="check-circle" class="w-6 h-6"></i>';
            }
            lucide.createIcons();
            document.getElementById('dialog-modal').classList.remove('hidden');
        }

        document.getElementById('modal-close-btn').addEventListener('click', () => {
            document.getElementById('dialog-modal').classList.add('hidden');
        });

        // Sidebar Collapse/Expand Toggle
        sidebarToggleBtn.addEventListener('click', () => {
            thumbnailSidebar.classList.toggle('hidden');
        });

        // Load PDF Document Data
        function renderPdfFromBuffer(bufferData) {
            pdfjsLib.getDocument({ data: bufferData }).promise.then((doc) => {
                pdfDoc = doc;
                pageCountDisplay.textContent = pdfDoc.numPages;
                thumbCountTag.textContent = `${pdfDoc.numPages} pages`;
                currentPageNum = 1;

                welcomeDropZone.classList.add('hidden');
                pdfWrapper.classList.remove('hidden');

                renderCurrentPage();
                generateThumbnails();
            }).catch((err) => {
                console.error("PDF load error:", err);
                displayModal("Error Reading PDF", "Unable to open file. Please make sure it is a valid PDF.");
            });
        }

        // Sample PDF Loader
        loadSampleBtn.addEventListener('click', () => {
            const sampleUrl = 'https://mozilla.github.io/pdf.js/web/compressed.tracemonkey-pldi-09.pdf';
            fetch(sampleUrl)
                .then(res => res.arrayBuffer())
                .then(buffer => renderPdfFromBuffer(new Uint8Array(buffer)))
                .catch(err => {
                    displayModal("Sample Load Failed", "Could not fetch sample PDF online. Please choose a local file.");
                });
        });

        // File Selection Handlers
        function processFile(file) {
            if (file && file.type === 'application/pdf') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    renderPdfFromBuffer(new Uint8Array(e.target.result));
                };
                reader.readAsArrayBuffer(file);
            } else {
                displayModal("Invalid File Type", "Please select a document in PDF format.");
            }
        }

        fileInput.addEventListener('change', (e) => { if (e.target.files[0]) processFile(e.target.files[0]); });
        dropzoneFileInput.addEventListener('change', (e) => { if (e.target.files[0]) processFile(e.target.files[0]); });

        // Drag and Drop
        welcomeDropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            welcomeDropZone.classList.add('border-indigo-500', 'bg-slate-900/80');
        });
        welcomeDropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            welcomeDropZone.classList.remove('border-indigo-500', 'bg-slate-900/80');
        });
        welcomeDropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            welcomeDropZone.classList.remove('border-indigo-500', 'bg-slate-900/80');
            if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
        });

        // Main Canvas Page Renderer
        function renderCurrentPage() {
            isRenderingPage = true;
            pdfDoc.getPage(currentPageNum).then((page) => {
                const viewport = page.getViewport({ scale: currentScale });
                
                pdfCanvas.height = viewport.height;
                pdfCanvas.width = viewport.width;

                laserCanvas.height = viewport.height;
                laserCanvas.width = viewport.width;

                const renderContext = {
                    canvasContext: pdfCtx,
                    viewport: viewport
                };

                const renderTask = page.render(renderContext);
                renderTask.promise.then(() => {
                    isRenderingPage = false;
                    if (pendingPageNum !== null) {
                        renderCurrentPage();
                        pendingPageNum = null;
                    }
                });
            });

            pageNumInput.value = currentPageNum;
            prevPageBtn.disabled = currentPageNum <= 1;
            nextPageBtn.disabled = currentPageNum >= pdfDoc.numPages;
            zoomDisplay.textContent = `${Math.round(currentScale * 100)}%`;
            
            highlightThumbnail(currentPageNum);
            strokePoints = []; // Clear current laser strokes on page turn
        }

        function queuePageRender(num) {
            if (isRenderingPage) {
                pendingPageNum = num;
            } else {
                currentPageNum = num;
                renderCurrentPage();
            }
        }

        // Pagination Events
        prevPageBtn.addEventListener('click', () => {
            if (currentPageNum > 1) queuePageRender(currentPageNum - 1);
        });
        nextPageBtn.addEventListener('click', () => {
            if (currentPageNum < pdfDoc.numPages) queuePageRender(currentPageNum + 1);
        });
        pageNumInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if (val >= 1 && val <= pdfDoc.numPages) {
                queuePageRender(val);
            } else {
                pageNumInput.value = currentPageNum;
            }
        });

        // Zoom Events
        zoomInBtn.addEventListener('click', () => {
            if (currentScale < 4.0) {
                currentScale += 0.25;
                renderCurrentPage();
            }
        });
        zoomOutBtn.addEventListener('click', () => {
            if (currentScale > 0.5) {
                currentScale -= 0.25;
                renderCurrentPage();
            }
        });
        zoomResetBtn.addEventListener('click', () => {
            currentScale = 1.25;
            renderCurrentPage();
        });

        // Fit Width & Screen
        fitWidthBtn.addEventListener('click', () => {
            if (!pdfDoc) return;
            pdfDoc.getPage(currentPageNum).then((page) => {
                const unscaled = page.getViewport({ scale: 1.0 });
                const availableWidth = viewerContainer.clientWidth - 64;
                currentScale = availableWidth / unscaled.width;
                renderCurrentPage();
            });
        });

        fitScreenBtn.addEventListener('click', () => {
            if (!pdfDoc) return;
            pdfDoc.getPage(currentPageNum).then((page) => {
                const unscaled = page.getViewport({ scale: 1.0 });
                const availableWidth = viewerContainer.clientWidth - 64;
                const availableHeight = viewerContainer.clientHeight - 64;
                const scaleW = availableWidth / unscaled.width;
                const scaleH = availableHeight / unscaled.height;
                currentScale = Math.min(scaleW, scaleH);
                renderCurrentPage();
            });
        });

        // Tool Mode Switching (Laser vs Hand)
        function setToolMode(mode) {
            activeTool = mode;
            if (mode === 'laser') {
                laserToolBtn.className = "px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 bg-indigo-600/30 text-indigo-300 border border-indigo-500/50 shadow-xs";
                handToolBtn.className = "px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800";
                colorPalette.classList.remove('hidden');
                colorPalette.classList.add('flex');
                viewerContainer.classList.add('pen-cursor');
                viewerContainer.classList.remove('grab-cursor', 'grabbing-cursor');
            } else {
                handToolBtn.className = "px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 bg-indigo-600/30 text-indigo-300 border border-indigo-500/50 shadow-xs";
                laserToolBtn.className = "px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800";
                colorPalette.classList.add('hidden');
                colorPalette.classList.remove('flex');
                viewerContainer.classList.remove('pen-cursor');
                viewerContainer.classList.add('grab-cursor');
            }
        }

        laserToolBtn.addEventListener('click', () => setToolMode('laser'));
        handToolBtn.addEventListener('click', () => setToolMode('hand'));

        // Color selection
        document.querySelectorAll('.color-option').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                laserPenColor = btn.getAttribute('data-color');
                document.querySelectorAll('.color-option').forEach(b => b.classList.remove('ring-2', 'ring-white'));
                btn.classList.add('ring-2', 'ring-white');
            });
        });

        // Get relative coordinates on the drawing canvas
        function getCanvasCoords(e) {
            const rect = laserCanvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return {
                x: (clientX - rect.left) * (laserCanvas.width / rect.width),
                y: (clientY - rect.top) * (laserCanvas.height / rect.height)
            };
        }

        // Prevent standard Context Menu on right click over viewer container
        viewerContainer.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // Unified Mouse & Pointer Events for Left-Click Laser Pen & Right-Click/Hand Pan
        viewerContainer.addEventListener('mousedown', (e) => {
            if (!pdfDoc) return;

            // RIGHT CLICK or HAND TOOL (Mode = Hand or Button = 2) -> Trigger 4-Directional Pan
            if (e.button === 2 || activeTool === 'hand') {
                isPanning = true;
                panStartX = e.clientX;
                panStartY = e.clientY;
                scrollStartX = viewerContainer.scrollLeft;
                scrollStartY = viewerContainer.scrollTop;
                viewerContainer.classList.add('grabbing-cursor');
                viewerContainer.classList.remove('grab-cursor', 'pen-cursor');
                return;
            }

            // LEFT CLICK with LASER TOOL -> Draw Laser Line
            if (e.button === 0 && activeTool === 'laser') {
                isDrawingLaser = true;
                const coords = getCanvasCoords(e);
                strokePoints.push({
                    x: coords.x,
                    y: coords.y,
                    timestamp: Date.now(),
                    color: laserPenColor,
                    isNewStroke: true
                });
            }
        });

        window.addEventListener('mousemove', (e) => {
            // Handle Panning
            if (isPanning) {
                const dx = e.clientX - panStartX;
                const dy = e.clientY - panStartY;
                viewerContainer.scrollLeft = scrollStartX - dx;
                viewerContainer.scrollTop = scrollStartY - dy;
                return;
            }

            // Handle Laser Drawing
            if (isDrawingLaser && activeTool === 'laser') {
                const coords = getCanvasCoords(e);
                strokePoints.push({
                    x: coords.x,
                    y: coords.y,
                    timestamp: Date.now(),
                    color: laserPenColor,
                    isNewStroke: false
                });
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (isPanning) {
                isPanning = false;
                viewerContainer.classList.remove('grabbing-cursor');
                if (activeTool === 'hand') {
                    viewerContainer.classList.add('grab-cursor');
                } else if (activeTool === 'laser') {
                    viewerContainer.classList.add('pen-cursor');
                }
            }
            if (isDrawingLaser) {
                isDrawingLaser = false;
            }
        });

        // Touch support for Pan and Laser Pen
        viewerContainer.addEventListener('touchstart', (e) => {
            if (!pdfDoc) return;
            if (activeTool === 'hand' || e.touches.length > 1) {
                isPanning = true;
                panStartX = e.touches[0].clientX;
                panStartY = e.touches[0].clientY;
                scrollStartX = viewerContainer.scrollLeft;
                scrollStartY = viewerContainer.scrollTop;
            } else if (activeTool === 'laser') {
                isDrawingLaser = true;
                const coords = getCanvasCoords(e);
                strokePoints.push({
                    x: coords.x,
                    y: coords.y,
                    timestamp: Date.now(),
                    color: laserPenColor,
                    isNewStroke: true
                });
            }
        }, { passive: false });

        viewerContainer.addEventListener('touchmove', (e) => {
            if (isPanning) {
                const dx = e.touches[0].clientX - panStartX;
                const dy = e.touches[0].clientY - panStartY;
                viewerContainer.scrollLeft = scrollStartX - dx;
                viewerContainer.scrollTop = scrollStartY - dy;
                e.preventDefault();
            } else if (isDrawingLaser && activeTool === 'laser') {
                const coords = getCanvasCoords(e);
                strokePoints.push({
                    x: coords.x,
                    y: coords.y,
                    timestamp: Date.now(),
                    color: laserPenColor,
                    isNewStroke: false
                });
                e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            isPanning = false;
            isDrawingLaser = false;
        });

        // Animation Frame for Auto-Fading Laser Lines (Apple/Samsung Note Effect)
        function renderLaserFadingStrokes() {
            laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);
            const now = Date.now();
            const lifespan = 1800; // Lines fade out over 1.8 seconds

            // Retain active un-expired points
            strokePoints = strokePoints.filter(p => (now - p.timestamp) < lifespan);

            if (strokePoints.length > 1) {
                laserCtx.lineCap = 'round';
                laserCtx.lineJoin = 'round';
                laserCtx.lineWidth = 5;

                for (let i = 1; i < strokePoints.length; i++) {
                    const pt = strokePoints[i];
                    const prevPt = strokePoints[i - 1];

                    if (pt.isNewStroke) continue;

                    const age = now - pt.timestamp;
                    const opacity = Math.max(0, 1 - (age / lifespan));

                    laserCtx.strokeStyle = pt.color.replace(/[\d\.]+\)$/g, `${opacity * 0.95})`);
                    laserCtx.shadowColor = pt.color.replace(/[\d\.]+\)$/g, `${opacity})`);
                    laserCtx.shadowBlur = 10; // Glowing neon aura effect

                    laserCtx.beginPath();
                    laserCtx.moveTo(prevPt.x, prevPt.y);
                    laserCtx.lineTo(pt.x, pt.y);
                    laserCtx.stroke();
                }
            }

            requestAnimationFrame(renderLaserFadingStrokes);
        }

        requestAnimationFrame(renderLaserFadingStrokes);

        // Sidebar Thumbnail Generator
        function generateThumbnails() {
            thumbnailsWrapper.innerHTML = '';
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const item = document.createElement('div');
                item.className = `group flex items-center space-x-3 p-2 rounded-xl cursor-pointer transition border border-transparent hover:bg-slate-800 ${i === currentPageNum ? 'bg-indigo-600/20 border-indigo-500/50 text-white' : 'text-slate-400'}`;
                item.dataset.page = i;

                item.innerHTML = `
                    <div class="w-8 h-10 bg-slate-950 rounded-lg border border-slate-800 flex items-center justify-center text-xs font-semibold shrink-0 group-hover:border-indigo-400 transition">${i}</div>
                    <div class="text-xs font-medium truncate">Page ${i}</div>
                `;

                item.addEventListener('click', () => {
                    queuePageRender(i);
                });

                thumbnailsWrapper.appendChild(item);
            }
        }

        function highlightThumbnail(page) {
            const children = thumbnailsWrapper.children;
            for (let child of children) {
                if (parseInt(child.dataset.page) === page) {
                    child.className = "group flex items-center space-x-3 p-2 rounded-xl cursor-pointer transition border border-indigo-500/50 bg-indigo-600/20 text-white shadow-xs";
                } else {
                    child.className = "group flex items-center space-x-3 p-2 rounded-xl cursor-pointer transition border border-transparent hover:bg-slate-800 text-slate-400";
                }
            }
        }

        // Global Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;

            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                if (pdfDoc && currentPageNum < pdfDoc.numPages) queuePageRender(currentPageNum + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                if (pdfDoc && currentPageNum > 1) queuePageRender(currentPageNum - 1);
            } else if (e.key === '+' || e.key === '=') {
                if (currentScale < 4.0) { currentScale += 0.25; renderCurrentPage(); }
            } else if (e.key === '-') {
                if (currentScale > 0.5) { currentScale -= 0.25; renderCurrentPage(); }
            } else if (e.key.toLowerCase() === 'l') {
                setToolMode('laser');
            } else if (e.key.toLowerCase() === 'h') {
                setToolMode('hand');
            } else if (e.key.toLowerCase() === 's') {
                thumbnailSidebar.classList.toggle('hidden');
            }
        });
    </script>
</body>
</html>
